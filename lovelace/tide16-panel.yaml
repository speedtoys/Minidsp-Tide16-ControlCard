# The complete front-panel view, exactly as it runs here - the bar meter,
# the source selector, the scene buttons, the volume ring and every live
# readout, painted back onto the plate.
#
# This is one entry in a dashboard's `views:` list. Drop it into a YAML
# dashboard, or paste the `cards:` block into the raw editor of a
# storage-mode dashboard (Edit dashboard > menu > Raw configuration
# editor) with the view set to panel mode.
#
# Needs:
#   - assets/ copied to config/www/tide16/
#   - packages/tide16_panel.yaml - the sensors this prints (split volume,
#     sample rate, Atmos flag) plus the two scripts it calls:
#     script.tide16_volume_step (the knob's relative dB steps, which have
#     to be server-side because Lovelace tap data is literal and cannot
#     read the current level) and script.tide16_power_toggle
#   - the entities from integration/tide16-metering.patch, in particular
#     button.tide16_scene_* for the four scene buttons
#   - card-mod, from HACS, for the scale() wrapper below. Delete the
#     card_mod block if you don't want that dependency - everything else
#     works without it, the panel is just rendered full width.
#
# Every position is a percentage of the 1990x400 plate, so the whole
# thing scales together at any display size. The numbers were measured
# off the artwork; changing the plate means re-measuring.
  # ---------- TIDE16 FRONT PANEL (dedicated view) ----------
  #
  # REBUILT on base-T16.pxd (decoded 2026-07-26). Everything below is
  # anchored to that plate's own CELLS, not to the old photo:
  #
  #   canvas            1990 x 400   (was 2622 x 542 - all % values moved)
  #   display window    x 0..810, y 78..312
  #     dB cell         x 123..344, y  78..162   ("dB" baked at x280-313, y96-117)
  #     Source cell     x 123..344, y 162..225   (label baked at x134, y174)
  #     meter cell      x 345..672, y  78..225   (empty - no baked 1-16 now)
  #     Program cell    x 123..506, y 225..312   (label baked at x135, y237)
  #     Listening cell  x 506..672, y 225..312   (label baked at x515, y237)
  #     badges cell     x 675..810, y  78..312   (empty)
  #   screen rules      y=162.5 and y=225.5
  #   miniDSP logo ink  x 17..277, y 13..56
  #   standby button    centre (1158, 200), top edge y=137
  #   volume knob       centre (1681, 202.5), radius 113
  #   silver end panel  x 1364..1989
  #
  # The new art is drawn at essentially the SAME scale as the device
  # photos used to place the Program block (its two screen rules are 63px
  # apart; the photos' are 63.5), so the row metrics measured off those
  # photos carry over 1:1 - see the Program readout below.
  #
  # Two things the plate now does that the old photo didn't, and which
  # deleted work here: "Program" is baked in (the readout no longer draws
  # its own title) and there are no baked 1-16 channel numbers under the
  # meter (its box is no longer pinned to them, so it just fills its cell).
  - title: Tide16
    path: tide16
    icon: mdi:audio-video
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: picture-elements
            # New FILENAME, not a new ?v= - the old plate.png was once
            # replaced in place and browsers kept serving the cached copy,
            # which presents as live bars animating behind painted ones.
            # A fresh path can't be got wrong.
            image: /local/tide16/plate-v2.png
            card_mod:
              style: |
                ha-card {
                  container-type: inline-size;
                  /* HIDDEN, not visible: it clips the square-cornered plate
                     to ha-card's 12px radius, so the white outline traces a
                     rounded box around a rounded image instead of cutting
                     across four square corners. This is only safe now that
                     the channel legend sits INSIDE the plate - while it was
                     at top:104% this clipped it away silently. */
                  overflow: hidden !important;
                  /* scale the whole card - image AND positioned text together,
                     so the glyph alignment cannot drift.
                     The 50px of air above the plate is a translate, not a
                     margin: a margin left ha-card's own box 50px taller than
                     the image, and the outline dutifully traced THAT - a
                     white line floating 50px below the plate's bottom edge.
                     translateY moves the painted card without touching its
                     box, and is not scaled by the scale() after it. */
                  transform: translateY(50px) scale(0.75);
                  transform-origin: top center;
                  padding: 0 !important;
                  background: transparent !important;
                  box-shadow: none !important;
                  /* 2px white line around the plate. OUTLINE, not border:
                     a border sits inside the box and would shrink the image
                     by 4px, shifting every percentage anchor on the card.
                     An outline takes no layout space at all.
                     It rides the 0.75 scale with the art, so it lands at
                     1.5 CSS px on screen - raise to 2.667px here if you
                     want a literal 2 screen px. */
                  border: none !important;
                  outline: 2px solid #fff;
                  outline-offset: 0;
                }
            elements:
              # Live 16-channel meter. It now fills the empty cell at
              # x345..672, y78..225 with an 8px inset. The old box had to
              # be exactly 16 bar-pitches wide because the plate painted
              # the numbers 1-16 underneath it; this plate paints nothing
              # there, so the box is free geometry and the legend below
              # the plate is what identifies the channels.
              - type: custom:tide16-bars
                style:
                  left: "17.739%"
                  top: "21.500%"
                  width: "15.628%"
                  # 86..203, not 86..217: the element now draws the 1-16
                  # numbers below its own box (base-T16.pxd doesn't bake
                  # them), and /tmp/deets.png puts their cap-top at y207.7
                  # with the cell rule at y225.
                  height: "29.250%"
                  transform: translate(0, 0)
                  pointer-events: none
              # Channel assignment legend, one compact row under the plate.
              # Lives INSIDE picture-elements so it inherits the 0.75 scale
              # and the centring, and fills the dead band the transform
              # leaves below the image (a transform doesn't shrink the
              # layout box) - top >100% is that band. Left-aligned to the
              # miniDSP logo ink, which starts at canvas x=17.
              # Sized down to fit: at the default 1.2cqw the row is ~1950
              # canvas px wide, but the dark faceplate only runs to the
              # silver end panel at x=1364, so type and gap are scaled to
              # ~0.65 to land inside x17..1285.
              # Lightened one step across the board against the black
              # faceplate: the speaker names go to white, and the two
              # dimmed pieces - the "Output Channels:" heading and the
              # output numbers - come up to the grey the names used to be.
              - type: custom:tide16-channels
                # The HELD list, not sensor.tide16_channel_levels: the
                # live one goes unavailable with the unit and used to take
                # the whole legend with it. The assignment only changes
                # when the speaker layout is reconfigured, so the last
                # known list stays correct on a dark panel. See
                # packages/tide16_panel.yaml.
                entity: sensor.tide16_channel_names_held
                attribute: channel_names
                font_size: 0.78cqw
                gap: 0.88cqw
                color: "#FFFFFF"
                index_color: "#B7B8B8"
                label_color: "#B7B8B8"
                style:
                  left: "0.854%"
                  top: "86.375%"
                  width: "66%"
                  transform: translate(0, 0)
              # Scene buttons, on the faceplate between the screen (ends
              # x=810) and the standby button (starts x=1102).
              # Buttons are 64 canvas px wide at 7:2, gap 1.190cqw - the
              # whole cluster scaled to 80% of the size it was drawn at,
              # button and gap alike, so the 7:2 shape and the spacing
              # stay in proportion. `left` moved right by half the 16px
              # the column lost, which keeps it centred where it was.
              #
              # The box is sized to the stack EXACTLY - 4 x 18.29 + 3 x
              # 23.68 = 144.2 canvas px, i.e. 36.047% of the 400px canvas -
              # so there is no slack for the buttons to sit in. That is
              # what puts the heading a true `title_gap` off the red
              # button: the title hangs at bottom:100% of this box, so it
              # is only as far from the first button as the box top is,
              # and matching title_gap to `gap` then makes that distance
              # the same as the one between the buttons.
              # Heading + buttons are then centred as one block on the
              # display window (canvas y79..312): 189.2px of cluster on a
              # 233px window leaves ~22px above the title and below the
              # last button. Change a size here and both the height and
              # the top must be recomputed - the block no longer absorbs
              # slack on its own.
              #
              # These are the TIDE16's OWN scenes, not Home Assistant
              # scenes: the device stores four whole-box snapshots (source,
              # volume, Dirac preset, Dirac on/off, bass management,
              # upmixer, Dolby/DTS) and names the slots by the colours on
              # its front panel - red, green, yellow, blue = index 0..3,
              # which is exactly the colour order drawn here.
              # Recall goes through button.tide16_scene_*, which calls the
              # device's set_scene. Saving is deliberately not reachable
              # from this card: the device's save_scene OVERWRITES a slot
              # with the current state and has no undo - use the stock web
              # UI at http://192.168.1.212:5050 for that.
              # As of 2026-07-26 only slots 0 (red) and 1 (green) have
              # anything saved; yellow and blue recall nothing until they
              # are saved on the device.
              - type: custom:tide16-buttons
                ratio: 7 / 2
                gap: 1.190cqw
                title: "Scenes:"
                title_size: 1.070cqw
                title_gap: 1.190cqw
                # `hint` is the hover text - on a colour-only button it is
                # the only name it has.
                buttons:
                  - color: "#D93A2B"
                    hint: Recall red scene
                    tap:
                      action: button.press
                      data: {entity_id: button.tide16_scene_red}
                  - color: "#2FA84F"
                    hint: Recall green scene
                    tap:
                      action: button.press
                      data: {entity_id: button.tide16_scene_green}
                  - color: "#E8C22E"
                    hint: Recall yellow scene
                    tap:
                      action: button.press
                      data: {entity_id: button.tide16_scene_yellow}
                  - color: "#2F6FD0"
                    hint: Recall blue scene
                    tap:
                      action: button.press
                      data: {entity_id: button.tide16_scene_blue}
                style:
                  left: "42.513%"
                  top: "36.473%"
                  width: "3.216%"
                  height: "36.047%"
                  transform: translate(0, 0)
              # Dolby profile column, in the void to the LEFT of the power
              # button - i.e. between the Scenes column and the standby
              # button. The plate art carries no ink between x800 and
              # x1121 (the standby button runs x1122..1213), and the
              # Scenes overlay ends at x918.7, so the free span is
              # x919..1121 and the column is centred on x=1020.
              #
              # Registered to the Scenes column rather than measured
              # independently: the heading sits on the same line as
              # "Scenes:" (its text box tops at y100.9) and the four
              # options take the scene buttons' own box - same `top`, same
              # `height`, same gap. That is not a coincidence that needs
              # maintaining, it is arithmetic: 4 rows of 1fr in a 144.2px
              # box with a 23.7px gap are 18.3px tall on a 42px pitch,
              # which IS the colour bars' pitch, and the cells centre
              # their labels. Move the scenes and this follows.
              #
              # The heading's "Dolby" is the double-D mark, not type -
              # /local/tide16/dolby.png is the supplied art keyed off its
              # opaque black background (alpha = luminance, so the
              # antialiased edges survive) and recoloured to the same
              # #BFC0C0 as the title text, so mark and word read as one
              # heading. Cropped to its own ink, which is what lets
              # title_image_scale mean cap height and be true.
              - type: custom:tide16-readout
                title: Profiles
                title_image: /local/tide16/dolby.png?v=1
                title_image_alt: Dolby
                title_size: 1.070cqw
                title_color: "#BFC0C0"
                title_gap: "0"
                align: center
                style:
                  left: "46.181%"
                  top: "25.225%"
                  width: "10.201%"
                  transform: translate(0, 0)
              # The options themselves. Same element as the source
              # selector, so the dot-and-label and the white/underlined/
              # larger active state are the ones already on the plate -
              # one column of four rather than six of two. Sizes are the
              # source rows' own ratios rescaled to the Scenes type
              # (1.070cqw): dot 0.938x, dot_gap 0.376x, active 1.187x.
              #
              # active_attribute MUST be null - it defaults to `source`
              # for the media_player it was written against, and here the
              # live value is the input_select's own state.
              #
              # NOT WIRED TO THE DEVICE: the integration has no upmixer
              # endpoint, so these set an HA input_select and nothing
              # else. See packages/tide16_panel.yaml.
              - type: custom:tide16-inputs
                columns: 1
                rows: 4
                row_gap: 1.190cqw
                # 20 canvas px. Sizes are canvas px on the 1990-wide
                # plate: 20 / 1990 = 1.005%.
                dot: 1.005cqw
                dot_gap: 0.402cqw
                # Matched to the SOURCE ROWS, not to the heading above:
                # same 0.804cqw (16 canvas px) and same weight 400 the
                # input labels use, so the two lists of selectable things
                # read as one family. The heading stays bigger at
                # 1.070cqw, which is the "Scenes:" size.
                size: 0.804cqw
                weight: "400"
                color: "#B7B8B8"
                # The DEVICE's own profile, read back over its websocket
                # by scripts/tide16_dolby.py. Each item carries a `value`
                # because the firmware's values are lowercase while the
                # labels are title case.
                active_entity: sensor.tide16_dolby_profile_live
                active_attribute: null
                active_color: "#FFFFFF"
                # The live one's button: lime green with a 1px white
                # border. Both MUST be quoted - an unquoted #32CD32 is a
                # YAML comment and the value silently vanishes. .dot is
                # box-sizing: border-box, so the border does not grow the
                # circle.
                active_background: "#32CD32"
                active_border: "1px solid #FFFFFF"
                # Weight, not size: every row has to stay level with its
                # scene bar, and 1.070cqw IS the "Profiles" heading size,
                # so the selection reads as bold rather than as a
                # different-sized row.
                active_weight: "700"
                items:
                  - text: Movie
                    value: movie
                    hint: "Set Dolby profile: Movie"
                    tap:
                      action: script.tide16_set_dolby_profile
                      data:
                        profile: movie
                  - text: Music
                    value: music
                    hint: "Set Dolby profile: Music"
                    tap:
                      action: script.tide16_set_dolby_profile
                      data:
                        profile: music
                  # Night, not Game: the firmware's profile list is
                  # off/movie/music/night. `game` exists in the device's
                  # web UI source but is commented out, so it cannot be
                  # selected on this unit.
                  - text: Night
                    value: night
                    hint: "Set Dolby profile: Night"
                    tap:
                      action: script.tide16_set_dolby_profile
                      data:
                        profile: night
                  # Both of these MUST stay quoted - YAML 1.1 reads a
                  # bare off as boolean false, which silently sends
                  # `profile: False` to the device and never matches the
                  # sensor's "off". Same trap as the input_select list.
                  - text: "Off"
                    value: "off"
                    hint: "Turn the Dolby profile off"
                    tap:
                      action: script.tide16_set_dolby_profile
                      data:
                        profile: "off"
                # The rows are left-aligned in this box, so `left` IS the
                # dot column - set so the widest row (dot x977.5 through
                # "Movie" ending x1063.5) centres on the void's x=1020.
                style:
                  left: "49.121%"
                  top: "36.473%"
                  width: "4.472%"
                  height: "36.047%"
                  transform: translate(0, 0)
              # Volume. "dB" is BAKED into the plate at x280-313, so the
              # decimal is left-aligned to it (x=280) and the integer is
              # RIGHT-aligned just short of it (x=274) - right-aligned so
              # "-9.5" and "-42.5" both stay registered to the dB mark
              # instead of the decimal point sliding.
              # The two share a baseline by construction: integer digits
              # end at y147.2, decimal digits at y147.6.
              #
              #
              # Drawn as readouts, not state-labels, and with NO
              # conditional. The integer's placeholder is the whole
              # "-.-" at one size, and the decimal's is empty, so a
              # missing reading shows one clean string instead of a big
              # hyphen, a small hyphen and a dot on three different
              # baselines (which is what feeding "-" through both halves
              # produced - a hyphen's ink is centred on the em box rather
              # than sitting on the baseline).
              #
              # This also covers the cold start. For ~15s after a restart
              # these sensors do not exist and for ~12s more they read
              # `unknown`; a state-label prints "Unavailable"/"Unknown"
              # through all of it, a readout prints "-" from first paint.
              #
              # The decimal's point comes from `prefix`, which is applied
              # only to a real value - the sensor returns digits only,
              # because HA coerces a leading "." into "0.5".
              - type: custom:tide16-readout
                size: 3.176cqw
                color: "#E7E8E8"
                row_gap: "0"
                align: right
                rows:
                  - entity: sensor.tide16_volume_integer
                    placeholder: "-.-"
                style:
                  right: "86.231%"
                  left: unset
                  top: "24.189%"
                  transform: translate(0, 0)
              - type: custom:tide16-readout
                size: 1.673cqw
                color: "#DFE0E0"
                row_gap: "0"
                rows:
                  - entity: sensor.tide16_volume_decimal
                    prefix: "."
                    placeholder: ""
                style:
                  left: "14.070%"
                  top: "30.259%"
                  transform: translate(0, 0)
              # Source value, left-aligned under the baked "Source" label
              # (its ink starts at x=134) in the same cell.
              - type: custom:tide16-readout
                size: 1.141cqw
                color: "#B7B8B8"
                row_gap: "0"
                rows:
                  - entity: sensor.tide16_source
                style:
                  left: "6.734%"
                  top: "49.929%"
                  transform: "translate(0, 0)"
              # Speaker layout, under the baked "Listening" label (x=515).
              - type: custom:tide16-readout
                size: 1.216cqw
                color: "#BFC0C0"
                row_gap: "0"
                rows:
                  - entity: sensor.tide16_speaker_config
                style:
                  left: "25.879%"
                  top: "64.723%"
                  transform: "translate(0, 0)"
              # Program readout - NO title any more: this plate bakes the
              # word "Program" in at x135, y237. The rows hang off that
              # baked label using the metrics measured from the device
              # photo, which transfer 1:1 because the new art is drawn at
              # the same scale: first row cap top 19px below the label's,
              # then a 17px pitch, at ~0.88 the label's size (cap 12px).
              # Rows land at y256 / 273 / 290; the last descender reaches
              # 305.5 against a cell bottom of 312.
              # Rate and Decoder are ATTRIBUTES of sensor.tide16_stream
              # (sample_rate / decoder_type), not separate entities.
              - type: custom:tide16-readout
                size: 0.844cqw
                row_gap: 0.010cqw
                rows:
                  - label: "Rate:"
                    entity: sensor.tide16_stream
                    attribute: sample_rate
                  - label: "Decoder:"
                    entity: sensor.tide16_stream
                    attribute: decoder_type
                  - label: "Stream:"
                    entity: sensor.tide16_stream
                style:
                  left: "6.784%"
                  top: "63.651%"
                  transform: translate(0, 0)
              # status ("ready") - placed off the device photo /tmp/ready.png
              # by that photo's own screen rules: it sits in the Program
              # cell to the RIGHT of the readout, level with the baked
              # "Program" label rather than with the rows, so the long
              # "Stream:" line passes underneath it.
              - type: custom:tide16-readout
                size: 0.724cqw
                color: "#332050"
                row_gap: "0"
                rows:
                  - entity: sensor.tide16_status
                style:
                  left: "18.010%"
                  top: "60.320%"
                  transform: "translate(0, 0)"
              # Sample rate, under the speaker layout in the Listening cell.
              # Both come from /tmp/deets.png, which maps 1:1 onto this
              # plate: its cell bottom derives to y311.4 against our 312,
              # and its label cap-top to y236.3 against the baked
              # "Listening" at 237. Cap tops: layout y260.9, rate y287.5.
              - type: custom:tide16-readout
                size: 1.075cqw
                color: "#BFC0C0"
                row_gap: "0"
                rows:
                  - entity: sensor.tide16_sample_rate_khz
                style:
                  left: "25.879%"
                  top: "71.431%"
                  transform: "translate(0, 0)"
              # Preset column. The plate bakes no "Preset" label, so the
              # heading is drawn as well. It occupies the LOWER half of the
              # cell at x675..810, mirroring the Listening cell's three
              # rows; the format badges moved up into the same cell's top
              # half to make room.
              - type: custom:tide16-readout
                title: Preset
                title_size: 0.844cqw
                title_gap: "0"
                style:
                  left: "34.372%"
                  top: "58.726%"
                  transform: translate(0, 0)
              - type: custom:tide16-readout
                size: 1.216cqw
                color: "#BFC0C0"
                row_gap: "0"
                rows:
                  - entity: sensor.tide16_preset
                    attribute: preset_index
                style:
                  left: "34.372%"
                  top: "64.723%"
                  transform: "translate(0, 0)"
              - type: custom:tide16-readout
                size: 1.075cqw
                color: "#BFC0C0"
                row_gap: "0"
                rows:
                  - entity: sensor.tide16_preset
                style:
                  left: "34.372%"
                  top: "71.431%"
                  transform: "translate(0, 0)"
              # Format badges, stacked in the empty cell at x675..810 -
              # the plate no longer carries the Dolby/dts/DIRAC/HDMI strip
              # along its bottom, so this cell is where they live now.
              # Both are centred on the cell's midline, x=742.5.
              #
              # Atmos is CONDITIONAL: drawing it unconditionally claimed
              # Atmos while the stream read "Third-party channel-based PCM".
              - type: conditional
                conditions:
                  - entity: binary_sensor.tide16_atmos
                    state: "on"
                elements:
                  - type: image
                    image: /local/tide16/dolby-atmos.png
                    style:
                      left: "34.698%"
                      top: "23.938%"
                      width: "5.226%"
                      transform: translate(0, 0)
                      filter: brightness(0.91)
                      pointer-events: none
              # Dirac Live mark - lit when Dirac is engaged, dimmed when not
              - type: conditional
                conditions:
                  - entity: switch.tide16_dirac_live
                    state: "on"
                elements:
                  - type: image
                    image: /local/tide16/dirac-a.png
                    tap_action:
                      action: perform-action
                      perform_action: switch.toggle
                      target:
                        entity_id: switch.tide16_dirac_live
                    style:
                      left: "35.930%"
                      top: "37.975%"
                      width: "2.764%"
                      transform: "translate(0, 0)"
                      cursor: pointer
              - type: conditional
                conditions:
                  - entity: switch.tide16_dirac_live
                    state_not: "on"
                elements:
                  - type: image
                    image: /local/tide16/dirac-a.png
                    tap_action:
                      action: perform-action
                      perform_action: switch.toggle
                      target:
                        entity_id: switch.tide16_dirac_live
                    style:
                      left: "35.930%"
                      top: "37.975%"
                      width: "2.764%"
                      transform: "translate(0, 0)"
                      # 80% grey when disabled: the mark's own ink peaks at
                      # luma 103, so brightness(0.496) after grayscale lands
                      # it on 51 - 20% luma, i.e. 80% grey.
                      filter: "grayscale(1) brightness(0.496)"
                      cursor: pointer
              # MUTE flag - only while the device is actually muted. Sized
              # to the plate's baked "Source" label (cap height 12 canvas
              # px = 0.844cqw), vertically centred on the red scene button,
              # and pinned 20px in from the screen's right edge (the window
              # ends at x=810, so 790 -> a 60.302% right offset). The box
              # shrink-wraps the word, so it's the RIGHT edge that's held
              # and the flag can't drift with the text width.
              - type: conditional
                conditions:
                  - entity: switch.tide16_mute
                    state: "on"
                elements:
                  - type: custom:tide16-readout
                    title: Mute
                    title_color: "#D93A2B"
                    title_size: 0.894cqw
                    title_gap: "0"
                    align: right
                    style:
                      right: "60.302%"
                      left: unset
                      top: "32.847%"
                      transform: translate(0, 0)
              # Source selector: 12 inputs as 6 columns x 2 rows of
              # round-button + label, across the plate's top band.
              # Left edge is the first output bar (canvas x=353); the row
              # runs to the silver end panel at x=1364. The band between
              # the image top and the display screen (y0..78) is 78px, so
              # the grid is 2/3 of it (52px) centred in it -> y13..65,
              # and with a 10px row gap each row is 21px.
              # grid-auto-flow is column, so the alphabetical list fills
              # DOWN each column and then moves right.
              # Selection goes through media_player.select_source using
              # the names from source_list - see tide16-bars.js for why
              # the button.tide16_source_* entities are NOT used.
              - type: custom:tide16-inputs
                columns: 6
                rows: 2
                row_gap: 0.503cqw
                # dot and label both up two canvas px from the original
                # (13 -> 15, 14 -> 16 of 1990), so the button keeps sitting
                # one px under its label the way it was drawn. The 21px
                # rows still swallow it: 16px of type and a 15px dot on a
                # 52px band.
                # 17 canvas px (was 15) - 17 / 1990 = 0.854%. Still
                # well inside the 21px rows, so the two-row grid is
                # unaffected.
                dot: 0.854cqw
                dot_gap: 0.302cqw
                size: 0.804cqw
                # matches the channel-name colour in the Output Channels
                # legend below (tide16-channels `color`)
                color: "#B7B8B8"
                # the live source is drawn white + underlined, and bigger
                # than the rest: 19 canvas px against 16. One px was the
                # first try and it is invisible - the plate renders at
                # about 0.67 CSS px per canvas px, so a single step is
                # sub-pixel. Three is the most the 21px rows will take.
                active_entity: media_player.tide16
                active_attribute: source
                active_color: "#FFFFFF"
                # The live one's button: lime green with a 1px white
                # border. Both MUST be quoted - an unquoted #32CD32 is a
                # YAML comment and the value silently vanishes. .dot is
                # box-sizing: border-box, so the border does not grow the
                # circle.
                active_background: "#32CD32"
                active_border: "1px solid #FFFFFF"
                active_size: 0.954cqw
                background: "#333333"
                # quoted: unquoted, YAML eats "#666666" as a comment and CSS
                # falls back to currentColor, drawing a WHITE border
                border: "1px solid #666666"
                items:
                  - text: "AppleTV"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "AppleTV"
                  - text: "ARC / eARC"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "ARC / eARC"
                  - text: "Bluetooth"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "Bluetooth"
                  - text: "Comcast"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "Comcast"
                  - text: "RCA"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "RCA"
                  - text: "Roku"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "Roku"
                  - text: "SPDIF 1"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "SPDIF 1"
                  - text: "SPDIF 2"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "SPDIF 2"
                  - text: "TOSLINK 1"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "TOSLINK 1"
                  - text: "TOSLINK 2"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "TOSLINK 2"
                  - text: "USB"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "USB"
                  - text: "XLR"
                    tap:
                      action: media_player.select_source
                      data:
                        entity_id: media_player.tide16
                        source: "XLR"
                style:
                  # 348, not the 353 the first output bar sits at: nudged
                  # 5 canvas px left by eye. Width is unchanged, so all six
                  # columns move together and the 168.5px column pitch is
                  # untouched.
                  left: "17.487%"
                  top: "3.250%"
                  width: "50.804%"
                  height: "13.000%"
                  transform: translate(0, 0)
              # Bluetooth pairing, in the dead space at the right end of
              # the source rows: column 6 (USB / XLR) runs out of ink at
              # canvas x=1240 and the silver end panel starts at 1364, so
              # the mark is centred in that 124px gap and on the two rows'
              # own midline (y13..65, centre 39). 48 canvas px, the same
              # height as the power glyph.
              # The logo art is /tmp/bt.png with its white page cut away on
              # the disc's own circle - the rune inside it is white too, so
              # a colour key would have eaten the mark along with the page.
              - type: custom:tide16-glyph
                image: /local/tide16/bt.png
                hint: Pair a Bluetooth device
                tap:
                  action: button.press
                  data: {entity_id: button.tide16_bluetooth_pair}
                style:
                  left: "64.221%"
                  top: "3.750%"
                  width: "2.412%"
                  transform: translate(0, 0)
              # "PAIR" under the mark, centred on it: same box left/width
              # as the glyph plus align: center, so the two stay registered
              # to each other if either moves. 4px under the disc's bottom
              # edge (y63), and set to the source labels' own `size`
              # (0.804cqw = 16 canvas px) so it reads as one of the row.
              - type: custom:tide16-readout
                title: PAIR
                title_size: 0.804cqw
                title_color: "#B7B8B8"
                title_gap: "0"
                align: center
                style:
                  left: "64.221%"
                  top: "16.750%"
                  width: "2.412%"
                  transform: translate(0, 0)
              # Power glyph over the standby button (centre x=1158, top
              # edge y=137), 9px clear of it. Ceiling is the "Scenes:"
              # heading, whose cap top computes to y=78 - this sits at 80.
              # custom:tide16-glyph, not the built-in `image`: the built-in
              # accepts a `title` but hangs it where the cursor never lands,
              # so the power glyph was the one control on the plate with no
              # working hover. See tide16-bars.js.
              - type: custom:tide16-glyph
                image: /local/tide16/power.png
                # Power OFF only. The Tide16 leaves the network entirely
                # in standby, so nothing this card can reach is listening
                # once it is off - waking it needs an IR remote, which is
                # outside this project's scope. Pressing it while already
                # off is a no-op, not an error.
                hint: Power off the Tide16
                tap:
                  action: script.tide16_power_off
                # Concave panel button. The BOX is the dish, so it needs a
                # height as well as a width or it comes out oval: 48x48
                # canvas px (2.412% of 1990, 12.000% of 400), centred on
                # x=1150.9 like the reboot glyph below it.
                # Pulled 5px further off the standby button than the icon
                # used to sit - box bottom y123 against the button's top
                # edge at y137, so 14px of clearance rather than 9. A dish
                # needs more air than a bare glyph or it crowds the real
                # button beneath it.
                # 48px dish, icon 33px (0.688 of it).
                #
                # Centred on x=1151.0, NOT on the ink bounding box of the
                # standby button. That bbox centres on 1161.5, but it is
                # wrong: the dome carries a bright specular highlight and
                # a soft shadow down its RIGHT side, which a threshold
                # reads as real geometry. Measure the circle's top and
                # bottom POLES instead - y140, y150, y250 and y260 all
                # come out symmetric about 1151.0. Anything centred on the
                # bbox sits ~10px right of the button it belongs to.
                #
                # Bottom edge y129 against the button's top at y138, so
                # 9px of clearance, mirrored by the reboot dish below.
                button: true
                icon_scale: 0.688
                style:
                  left: "56.633%"
                  top: "20.250%"
                  width: "2.412%"
                  height: "12.000%"
                  transform: translate(0, 0)
              # Reboot glyph, the standby button's mirror image: same 9px
              # clear of the button but off its BOTTOM edge (the art's ring
              # fades out by y=264, so y=273), and centred on the same
              # vertical as the power glyph above - centre x=1150.9.
              # Sized to the power glyph's HEIGHT, not its width: 48 canvas
              # px tall either way, which is what makes the pair read as
              # one size even though the source art is square (273x274)
              # and the power glyph is taller than it is wide.
              # /local/tide16/reboot.png is the supplied line art recoloured
              # to the same #BFC0C0 as power.png, on transparency, with the
              # word "REBOOT" cropped off.
              # Live: a single tap restarts the processor. Same glyph
              # element as the power icon, so the hover works for the same
              # reason - see tide16-glyph in tide16-bars.js.
              - type: custom:tide16-glyph
                image: /local/tide16/reboot.png
                hint: Reboot the Tide16
                tap:
                  action: button.press
                  data: {entity_id: button.tide16_reboot}
                # Same dish as the power button, mirrored below the
                # standby button: box top y278 against the ring fading out
                # at y264, so the same 14px of clearance.
                button: true
                icon_scale: 0.688
                style:
                  left: "56.633%"
                  top: "68.000%"
                  width: "2.412%"
                  height: "12.000%"
                  transform: translate(0, 0)
              # Volume/mute ring around the knob on the silver end panel.
              # The box IS the knob: centre (1681, 202.5) radius 113, so
              # left/top are centre-radius and width/height are the 226px
              # diameter. Every label places itself outside that circle by
              # clock hour - this box is the only geometry to re-measure
              # if the plate art changes again. See tide16-bars.js.
              - type: custom:tide16-knob-labels
                gap: 0.458cqw
                color: "#000"
                size: 1.012cqw
                weight: "700"
                # `hint` is the hover text. Without one a label just
                # repeats itself ("Vol:+5"), which tells you nothing you
                # can't already read - so each one spells out the action.
                labels:
                  - at: 12
                    text: ["Mute:", "On"]
                    hint: Mute on
                    tap:
                      action: switch.turn_on
                      data: {entity_id: switch.tide16_mute}
                  - at: 6
                    text: ["Mute:", "Off"]
                    hint: Mute off
                    tap:
                      action: switch.turn_off
                      data: {entity_id: switch.tide16_mute}
                  # Relative dB steps - the maths and the -127.5..0 clamp
                  # live in script.tide16_volume_step, because Lovelace
                  # tap data is literal and can't read the current level.
                  - at: 3
                    text: "Vol:+10"
                    hint: Volume up 10 dB
                    tap:
                      action: script.tide16_volume_step
                      data: {delta: 10}
                  - at: 2
                    text: "Vol:+5"
                    hint: Volume up 5 dB
                    tap:
                      action: script.tide16_volume_step
                      data: {delta: 5}
                  - at: 1
                    text: "Vol:+2"
                    hint: Volume up 2 dB
                    tap:
                      action: script.tide16_volume_step
                      data: {delta: 2}
                  - at: 11
                    text: "Vol:-2"
                    hint: Volume down 2 dB
                    tap:
                      action: script.tide16_volume_step
                      data: {delta: -2}
                  - at: 10
                    text: "Vol:-5"
                    hint: Volume down 5 dB
                    tap:
                      action: script.tide16_volume_step
                      data: {delta: -5}
                  - at: 9
                    text: "Vol:-10"
                    hint: Volume down 10 dB
                    tap:
                      action: script.tide16_volume_step
                      data: {delta: -10}
                style:
                  left: "78.794%"
                  top: "22.375%"
                  width: "11.357%"
                  height: "56.500%"
                  transform: translate(0, 0)
              # Card version, bottom-RIGHT of the silver end panel
              # (x1364..1989, full height). Black on the silver, 19.5
              # canvas px. Anchored by `right`, not `left`, so it stays
              # pinned to the panel's edge whatever the string grows to -
              # which needs `left: unset`, because picture-elements sets
              # left itself. The 0.854% inset is the same one the channel
              # legend uses on the other end of the plate.
              # A readout with a title and no rows is the card's
              # static-text element.
              - type: custom:tide16-readout
                title: v1.1.7
                title_size: 0.980cqw
                title_color: "#000"
                title_gap: "0"
                align: right
                style:
                  right: "0.854%"
                  left: unset
                  top: "91.625%"
                  width: "4.020%"
                  transform: translate(0, 0)
